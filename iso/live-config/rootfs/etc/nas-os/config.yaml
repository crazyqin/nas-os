# NAS-OS live 试用 / 裸机安装默认配置
#
# Web 管理界面监听所有接口：live 试用模式必须允许局域网浏览器访问
# （控制台横幅承诺 http://<本机IP>:8080；仅绑 127.0.0.1 时局域网与
#  QEMU 冒烟探测均不可达——2026-09-25 冒烟第 6 次根因：本文件缺失时
#  nasd 回退 127.0.0.1 默认值，hostfwd 转发到 guest 外部地址被 RST）。
# 无头 NAS 安装后同样需要从浏览器完成首次配置；如需收紧监听范围，
# 修改 host 为具体地址后 systemctl restart nas-os。
server:
  host: "0.0.0.0"
  port: 8080
