# /etc/nas-os/sync.conf — Cloud Drive Sync 配置
# 云同步守护进程配置文件

[daemon]
# 轮询间隔（秒）— 多久扫描一次同步队列
poll_interval = 30
# 并发同步任务数
max_concurrent_tasks = 4
# 任务超时（秒）— 单次同步最长运行时间
task_timeout = 3600

[versioning]
# 版本保留数量（每个文件保留的历史版本数）
keep_versions = 5
# 版本存储目录（相对于 /var/lib/nas-os）
version_dir = sync-versions

[logging]
# 日志级别: debug, info, warn, error
level = info
# 日志输出: stdout, file
output = file
# 日志文件路径
file_path = /var/log/nas-os/sync.log

[metrics]
# Prometheus metrics 端口
port = 9101
# metrics 路径
path = /metrics

[health]
# 健康检查端口
port = 9102
# 健康检查路径前缀
path = /healthz/sync
