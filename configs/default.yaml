# Live SMB/NFS behavior is driven by managers constructed in application/web
# (paths.samba_config / paths.nfs_exports), not by the blocks below.
# Live monitoring uses modules constructed when optional=true or separate
# monitoring configs under configs/monitoring*.yaml — not this monitor: block.
