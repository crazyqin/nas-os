# NAS-OS 默认配置
# 强类型加载路径见 internal/config。可通过 --config 指定，
# 也可用环境变量 NAS_OS_* 覆盖运行时字段。

server:
  host: 127.0.0.1
  port: 8080

paths:
  mount_base: /mnt
  config_dir: /etc/nas-os
  data_dir: /var/lib/nas-os
  samba_config: /etc/samba/smb.conf
  nfs_exports: /etc/exports

storage:
  default_profile: single
  auto_scrub: true
  scrub_schedule: "0 2 * * 0"  # 每周日凌晨 2 点

auth:
  session_ttl_hours: 24
  # initial_password 请勿写入版本控制，建议通过环境变量注入
  initial_password: ""

modules:
  # When false (default), non-Core product managers are not constructed.
  optional: false
  docker:
    enabled: false
    data_root: /mnt/docker
  # Optional product extensions (empty = none loaded on default boot).
  # Known: activeprotect, agentworkflow, aiguardrails, compliancescan,
  #        deployorch, netdiag, voicehub
  # Lab packages under internal/lab/ are never loaded via this list.
  extensions: []

# ==================== 兼容旧字段（未接入 config 包） ====================
# 以下字段保留自旧版配置，后续按模块迁移到 config 包表达。

smb:
  enabled: true
  workgroup: WORKGROUP
  guest_access: false

nfs:
  enabled: true
  allowed_networks:
    - 192.168.1.0/24

monitor:
  disk_check_interval: 60      # 秒
  space_warning_threshold: 80  # %
  space_critical_threshold: 95 # %
