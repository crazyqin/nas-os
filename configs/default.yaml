# NAS-OS 默认配置
# 强类型加载路径见 internal/config。可通过 --config 指定，
# 也可用环境变量 NAS_OS_* 覆盖运行时字段。
#
# 默认产品面：仅 Core（identity/storage/network/sharing/system）。
# ADR-0001 Stage 3: 主配置面为 packages.*（见 docs/adr/0001-platform-packages-host-sdk.md）
# modules.optional / modules.extensions 仍可读（兼容），但已弃用。

server:
  host: 127.0.0.1
  port: 8080

paths:
  mount_base: /mnt
  config_dir: /etc/nas-os
  data_dir: /var/lib/nas-os
  samba_config: /etc/samba/smb.conf
  nfs_exports: /etc/exports

storage:
  default_profile: single
  auto_scrub: true
  scrub_schedule: "0 2 * * 0"  # 每周日凌晨 2 点

auth:
  session_ttl_hours: 24
  # initial_password 请勿写入版本控制，建议通过环境变量注入
  initial_password: ""

# Preferred package surface (ADR-0001 Stage 3 + community path).
packages:
  # When true, expands official recommended product set (docker/vm/photos/ai/…).
  recommended_system: false
  # Named packages: official HTTP extensions and/or third-party IDs, e.g.:
  #   voicehub, netdiag, com.example.hello-host
  # Full official catalog: GET /api/v1/packages or config.SystemPackageCatalog.
  enabled: []
  # Third-party package root (subdirs with manifest.json). Empty = no discovery.
  # Example: /var/lib/nas-os/community-packages
  # See examples/community-packages/hello-host and docs/STRUCTURE.md.
  community_dir: ""
  # Deprecated Go .so plugin.Manager host (internal/plugin). Default off.
  # Third-party path is community_dir + Host SDK + Application Center.
  legacy_so_plugins: false

modules:
  # Docker data path settings (not deprecated).
  docker:
    enabled: false
    data_root: /mnt/docker
  # DEPRECATED — use packages.recommended_system (dual-read still works).
  optional: false
  # DEPRECATED — use packages.enabled (dual-read still works).
  # Lab packages under internal/lab/ are never loaded via this list.
  extensions: []

# -----------------------------------------------------------------------------
# UNUSED / LEGACY (not loaded by internal/config typed loader)
# -----------------------------------------------------------------------------
# The following YAML keys are kept only for historical compose snippets and
# operator notes. They are NOT part of the typed config.Config schema and have
# NO effect on nasd until a future migration wires them.
#
# Live SMB/NFS behavior is driven by managers constructed in application/web
# (paths.samba_config / paths.nfs_exports), not by the blocks below.
# Live monitoring uses modules constructed when packages.recommended_system=true
# or separate monitoring configs under configs/monitoring*.yaml.
#
# Do not treat these as active defaults.
#
