# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                         Redis - 高性能内存数据库                              ║
# ║                      缓存、会话存储、消息队列                                  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📋 应用信息
# ─────────────────────────────────────────────────────────────────────────────
# 镜像:     redis:7-alpine
# 类别:     数据库/缓存
# 官网:     https://redis.io
# 许可证:   开源免费 (BSD)
#
# ✨ 功能特性
# ─────────────────────────────────────────────────────────────────────────────
# • 高速缓存
# • 会话存储
# • 消息队列
# • 发布订阅
# • 数据结构丰富
#
# 💾 数据目录
# ─────────────────────────────────────────────────────────────────────────────
# /var/lib/nas-os/data/redis/ - 持久化数据
#
# 🚀 部署向导
# ─────────────────────────────────────────────────────────────────────────────
# 1. 快速启动:
#    $ docker compose -f apps/templates/redis.yml up -d
#
# 2. 验证运行:
#    $ docker compose -f apps/templates/redis.yml ps
#    $ redis-cli ping  # 应返回 PONG
#
# 🔧 环境变量
# ─────────────────────────────────────────────────────────────────────────────
# REDIS_PASSWORD  - 访问密码（可选，生产环境建议设置）
# REDIS_MAXMEMORY - 最大内存（默认 256MB）
#
# v2.387.0 工部优化：应用模板标准化

services:
  redis:
    image: redis:7-alpine
    container_name: nas-redis
    restart: unless-stopped
    
    # ─── 启动命令 ─────────────────────────────────────────────────────────────
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    
    # ─── 网络配置 ─────────────────────────────────────────────────────────────
    ports:
      - "6379:6379"
    
    # ─── 存储挂载 ─────────────────────────────────────────────────────────────
    volumes:
      - redis-data:/data
    
    # ─── 环境变量 ─────────────────────────────────────────────────────────────
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    
    # ─── 健康检查 ─────────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    # ─── 资源限制 ─────────────────────────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    # ─── 日志配置 ─────────────────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,app"
        tag: "{{.Name}}/{{.ImageName}}"
    
    # ─── 服务标签 ─────────────────────────────────────────────────────────────
    labels:
      - "nas-os.app=redis"
      - "nas-os.category=database"
      - "nas-os.description=High-performance in-memory database and cache"
      - "nas-os.healthcheck.enabled=true"
      - "nas-os.logging.enabled=true"
    
    # ─── 网络隔离 ─────────────────────────────────────────────────────────────
    networks:
      - nas-app-network

# ══════════════════════════════════════════════════════════════════════════════
# 网络配置
# ══════════════════════════════════════════════════════════════════════════════
networks:
  nas-app-network:
    external: true
    name: nas-app-network

# ══════════════════════════════════════════════════════════════════════════════
# 卷配置
# ══════════════════════════════════════════════════════════════════════════════
volumes:
  redis-data:
    driver: local
    labels:
      - "nas-os.app=redis"
      - "nas-os.volume=data"

