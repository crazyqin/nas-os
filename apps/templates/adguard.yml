# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                      AdGuard Home - DNS 广告拦截                                ║
# ║                    DNS 服务器 + 广告拦截，网络级防护                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📋 应用信息
# ─────────────────────────────────────────────────────────────────────────────
# 镜像:     adguard/adguardhome:latest
# 类别:     网络服务
# 官网:     https://adguard.com/adguard-home.html
# 许可证:   开源免费 (GPLv3)
#
# ✨ 功能特性
# ─────────────────────────────────────────────────────────────────────────────
# • DNS 广告拦截
# • 网络级过滤（无需安装插件）
# • 家长控制
# • DNS-over-HTTPS/TLS
# • 自定义过滤规则
# • 统计面板
# • HTTPS DNS 支持
#
# 💾 数据目录
# ─────────────────────────────────────────────────────────────────────────────
# /var/lib/nas-os/data/adguard/ - 配置与数据
#
# 🚀 部署向导
# ─────────────────────────────────────────────────────────────────────────────
# 1. 一键启动:
#    $ docker compose -f apps/templates/adguard.yml up -d
#
# 2. 访问 Web UI:
#    http://localhost:3003
#
# 3. 首次访问设置管理员账号
#
# 4. 配置设备 DNS 指向 NAS IP
#
# 🔧 环境变量
# ─────────────────────────────────────────────────────────────────────────────
# 无必需环境变量
#
# v2.388.0 工部优化：应用模板标准化

services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: nas-adguard
    restart: unless-stopped
    
    ports:
      # Web UI
      - "3003:80"
      # DNS 服务（TCP/UDP）
      - "53:53/tcp"
      - "53:53/udp"
      # DNS-over-HTTPS
      - "443:443/tcp"
      - "443:443/udp"
      # DNS-over-TLS
      - "853:853/tcp"
      # DNS-over-QUIC
      - "784:784/udp"
      - "8853:8853/udp"
    
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,app"
        tag: "{{.Name}}/{{.ImageName}}"
    
    labels:
      - "nas-os.app=adguard"
      - "nas-os.category=network"
      - "nas-os.description=DNS-based ad blocker"
      - "nas-os.healthcheck.enabled=true"
      - "nas-os.logging.enabled=true"
    
    networks:
      - nas-app-network

# ══════════════════════════════════════════════════════════════════════════════
# 网络配置
# ══════════════════════════════════════════════════════════════════════════════
networks:
  nas-app-network:
    external: true
    name: nas-app-network

# ══════════════════════════════════════════════════════════════════════════════
# 卷配置
# ══════════════════════════════════════════════════════════════════════════════
volumes:
  adguard-work:
    driver: local
    labels:
      - "nas-os.app=adguard"
      - "nas-os.volume=work"
  
  adguard-conf:
    driver: local
    labels:
      - "nas-os.app=adguard"
      - "nas-os.volume=config"

# ─────────────────────────────────────────────────────────────────────────────
# 说明
# ─────────────────────────────────────────────────────────────────────────────
# • 访问地址：http://localhost:3003
# • 首次访问设置管理员账号
# • 配置设备 DNS 指向 NAS IP 地址
# • 支持自定义过滤规则
# • 支持 DNS-over-HTTPS/TLS/QUIC
# • 注意：53 端口可能与其他 DNS 服务冲突