# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                         Plex - 媒体服务器与流媒体平台                         ║
# ║                    电影/音乐/照片管理，硬件转码，远程访问                      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📋 应用信息
# ─────────────────────────────────────────────────────────────────────────────
# 镜像:     plexinc/pms-docker:plexpass
# 类别:     媒体服务
# 官网:     https://www.plex.tv
# 许可证:   免费（部分功能需 Plex Pass 订阅）
#
# ✨ 功能特性
# ─────────────────────────────────────────────────────────────────────────────
# • 电影/电视剧管理
# • 音乐播放
# • 照片管理
# • 硬件转码（Intel/NVIDIA）
# • 远程访问
# • DLNA/Chromecast/Roku 支持
#
# 💾 数据目录
# ─────────────────────────────────────────────────────────────────────────────
# /var/lib/nas-os/data/plex/config    - 配置文件
# /var/lib/nas-os/data/plex/transcode - 转码缓存
# /var/lib/nas-os/media               - 媒体文件
#
# 🚀 部署向导
# ─────────────────────────────────────────────────────────────────────────────
# 1. 获取 Claim Token:
#    访问 https://plex.tv/claim 获取 token
#
# 2. 设置环境变量:
#    $ export PLEX_CLAIM=your_claim_token
#
# 3. 启动服务:
#    $ docker compose -f apps/templates/plex.yml up -d
#
# 4. 访问 Web UI:
#    http://localhost:32400/web
#
# 🔧 环境变量
# ─────────────────────────────────────────────────────────────────────────────
# PLEX_CLAIM      - 首次激活 Token（从 plex.tv/claim 获取）
# TZ               - 时区设置
# NAS_MEDIA_DIR    - 媒体目录（默认 /var/lib/nas-os/media）
#
# ⚙️ 硬件加速
# ─────────────────────────────────────────────────────────────────────────────
# Intel QuickSync: 取消注释 /dev/dri 设备映射
# NVIDIA GPU: 取消注释 /dev/nvidia 设备映射
#
# v2.387.0 工部优化：应用模板标准化

services:
  plex:
    image: plexinc/pms-docker:plexpass
    container_name: nas-plex
    restart: unless-stopped
    
    # ─── 网络配置 ─────────────────────────────────────────────────────────────
    # 推荐使用 host 模式以获得最佳远程访问体验
    network_mode: host
    
    # ─── 存储挂载 ─────────────────────────────────────────────────────────────
    volumes:
      # 配置和转码
      - plex-config:/config
      - plex-transcode:/transcode
      # 媒体库（只读挂载）
      - ${NAS_MEDIA_DIR:-/var/lib/nas-os/media}/movies:/data/movies:ro
      - ${NAS_MEDIA_DIR:-/var/lib/nas-os/media}/tv:/data/tv:ro
      - ${NAS_MEDIA_DIR:-/var/lib/nas-os/media}/music:/data/music:ro
      - ${NAS_MEDIA_DIR:-/var/lib/nas-os/media}/photos:/data/photos:ro
    
    # ─── 环境变量 ─────────────────────────────────────────────────────────────
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PLEX_CLAIM=${PLEX_CLAIM:-}
      # 硬件加速（取消注释以启用）
      # - PLEX_TRANSCODE_DEVICE=/dev/dri/card0
    
    # ─── 设备访问（硬件加速）─────────────────────────────────────────────────
    # Intel QuickSync (VA-API)
    # devices:
    #   - /dev/dri:/dev/dri
    # NVIDIA GPU
    # devices:
    #   - /dev/nvidia:/dev/nvidia
    
    # ─── 健康检查 ─────────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/web"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # ─── 资源限制 ─────────────────────────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 512M
    
    # ─── 日志配置 ─────────────────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,app"
        tag: "{{.Name}}/{{.ImageName}}"
    
    # ─── 服务标签 ─────────────────────────────────────────────────────────────
    labels:
      - "nas-os.app=plex"
      - "nas-os.category=media"
      - "nas-os.description=Media server with streaming and remote access"
      - "nas-os.healthcheck.enabled=true"
      - "nas-os.logging.enabled=true"

# ══════════════════════════════════════════════════════════════════════════════
# 卷配置
# ══════════════════════════════════════════════════════════════════════════════
volumes:
  plex-config:
    driver: local
    labels:
      - "nas-os.app=plex"
      - "nas-os.volume=config"
  
  plex-transcode:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
    labels:
      - "nas-os.app=plex"
      - "nas-os.volume=transcode"

# ─────────────────────────────────────────────────────────────────────────────
# 说明
# ─────────────────────────────────────────────────────────────────────────────
# • 初次访问：http://localhost:32400/web 进行设置
# • 需要 Plex 账号登录（免费账号可使用基本功能）
# • Plex Pass 订阅解锁：硬件转码、Live TV、移动端离线下载等
# • 支持 DLNA、Chromecast、Roku、Apple TV 等设备
# • 建议使用 host 网络模式以获得最佳远程访问体验
#
# 免费版本（无 Plex Pass）使用：
# image: plexinc/pms-docker:public