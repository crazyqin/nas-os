# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                        Syncthing - 文件同步工具                                 ║
# ║                    P2P 文件同步，无需中心服务器                                   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📋 应用信息
# ─────────────────────────────────────────────────────────────────────────────
# 镜像:     syncthing/syncthing:latest
# 类别:     存储服务
# 官网:     https://syncthing.net
# 许可证:   开源免费 (MPLv2)
#
# ✨ 功能特性
# ─────────────────────────────────────────────────────────────────────────────
# • P2P 文件同步
# • 无中心服务器
# • 点对点加密
# • 版本控制
# • 文件夹选择性同步
# • 跨平台支持
#
# 💾 数据目录
# ─────────────────────────────────────────────────────────────────────────────
# /var/lib/nas-os/data/syncthing/config  - 配置文件
# /var/lib/nas-os/sync                   - 同步目录
#
# 🚀 部署向导
# ─────────────────────────────────────────────────────────────────────────────
# 1. 一键启动:
#    $ docker compose -f apps/templates/syncthing.yml up -d
#
# 2. 访问 Web UI:
#    http://localhost:8384
#
# 3. 添加同步设备并配置同步文件夹
#
# 🔧 环境变量
# ─────────────────────────────────────────────────────────────────────────────
# SYNCTHING_DATA_DIR - 同步数据目录
#
# v2.388.0 工部优化：应用模板标准化

services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: nas-syncthing
    restart: unless-stopped
    
    hostname: nas-syncthing
    
    ports:
      - "8384:8384"   # Web UI
      - "22000:22000/tcp" # TCP 监听端口
      - "22000:22000/udp" # QUIC 协议
      - "21027:21027/udp" # 本地发现端口
    
    volumes:
      - syncthing-config:/var/syncthing/config
      - syncthing-data:/var/syncthing/data
      - ${SYNCTHING_DATA_DIR:-/var/lib/nas-os/sync}:/data/Sync
      # 添加更多同步目录
      # - ${NAS_MEDIA_DIR:-/var/lib/nas-os/media}:/data/Media:ro
    
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PUID=1000
      - PGID=1000
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8384/rest/noauth/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,app"
        tag: "{{.Name}}/{{.ImageName}}"
    
    labels:
      - "nas-os.app=syncthing"
      - "nas-os.category=storage"
      - "nas-os.description=P2P file synchronization without central server"
      - "nas-os.healthcheck.enabled=true"
      - "nas-os.logging.enabled=true"
    
    networks:
      - nas-app-network

# ══════════════════════════════════════════════════════════════════════════════
# 网络配置
# ══════════════════════════════════════════════════════════════════════════════
networks:
  nas-app-network:
    external: true
    name: nas-app-network

# ══════════════════════════════════════════════════════════════════════════════
# 卷配置
# ══════════════════════════════════════════════════════════════════════════════
volumes:
  syncthing-config:
    driver: local
    labels:
      - "nas-os.app=syncthing"
      - "nas-os.volume=config"
  
  syncthing-data:
    driver: local
    labels:
      - "nas-os.app=syncthing"
      - "nas-os.volume=data"

# ─────────────────────────────────────────────────────────────────────────────
# 说明
# ─────────────────────────────────────────────────────────────────────────────
# • 访问地址：http://localhost:8384
# • 首次访问设置用户名密码
# • 在其他设备安装 Syncthing 并添加此设备
# • 支持 iOS/Android/Windows/macOS/Linux
# • 数据端到端加密传输