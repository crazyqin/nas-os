# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                         Vaultwarden - 密码管理器                              ║
# ║                    Bitwarden 轻量实现，私有密码管理                            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📋 应用信息
# ─────────────────────────────────────────────────────────────────────────────
# 镜像:     vaultwarden/server:latest
# 类别:     存储服务
# 官网:     https://github.com/dani-garcia/vaultwarden
# 许可证:   开源免费 (GPL)
#
# ✨ 功能特性
# ─────────────────────────────────────────────────────────────────────────────
# • 密码管理
# • 两步验证
# • 安全分享
# • 跨平台同步
# • Bitwarden 完全兼容
#
# 💾 数据目录
# ─────────────────────────────────────────────────────────────────────────────
# /var/lib/nas-os/data/vaultwarden/ - 持久化数据
#
# 🚀 部署向导
# ─────────────────────────────────────────────────────────────────────────────
# 1. 设置管理员密码:
#    $ export ADMIN_TOKEN=your_secure_token
#
# 2. 启动服务:
#    $ docker compose -f apps/templates/vaultwarden.yml up -d
#
# 3. 访问 Web UI:
#    http://localhost:8080
#
# 🔧 环境变量
# ─────────────────────────────────────────────────────────────────────────────
# ADMIN_TOKEN     - 管理员密码（必须设置）
# SIGNUPS_ALLOWED - 允许注册（默认 true）
# DOMAIN          - 服务域名（用于邮件通知）
#
# v2.387.0 工部优化：应用模板标准化

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: nas-vaultwarden
    restart: unless-stopped
    
    # ─── 网络配置 ─────────────────────────────────────────────────────────────
    ports:
      - "8080:80"
      - "3012:3012"
    
    # ─── 存储挂载 ─────────────────────────────────────────────────────────────
    volumes:
      - vaultwarden-data:/data
    
    # ─── 环境变量 ─────────────────────────────────────────────────────────────
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-changeme}
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED:-true}
      - DOMAIN=${DOMAIN:-http://localhost:8080}
    
    # ─── 健康检查 ─────────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # ─── 资源限制 ─────────────────────────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    # ─── 日志配置 ─────────────────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,app"
        tag: "{{.Name}}/{{.ImageName}}"
    
    # ─── 服务标签 ─────────────────────────────────────────────────────────────
    labels:
      - "nas-os.app=vaultwarden"
      - "nas-os.category=storage"
      - "nas-os.description=Lightweight Bitwarden password manager"
      - "nas-os.healthcheck.enabled=true"
      - "nas-os.logging.enabled=true"
    
    # ─── 网络隔离 ─────────────────────────────────────────────────────────────
    networks:
      - nas-app-network

# ══════════════════════════════════════════════════════════════════════════════
# 网络配置
# ══════════════════════════════════════════════════════════════════════════════
networks:
  nas-app-network:
    external: true
    name: nas-app-network

# ══════════════════════════════════════════════════════════════════════════════
# 卷配置
# ══════════════════════════════════════════════════════════════════════════════
volumes:
  vaultwarden-data:
    driver: local
    labels:
      - "nas-os.app=vaultwarden"
      - "nas-os.volume=data"