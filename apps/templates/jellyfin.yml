# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                         Jellyfin - 开源媒体服务器                             ║
# ║                    电影/音乐管理，完全免费，硬件转码                            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📋 应用信息
# ─────────────────────────────────────────────────────────────────────────────
# 镜像:     jellyfin/jellyfin:latest
# 类别:     媒体服务
# 官网:     https://jellyfin.org
# 许可证:   开源免费 (GPL)
#
# ✨ 功能特性
# ─────────────────────────────────────────────────────────────────────────────
# • 电影/电视剧管理
# • 音乐播放
# • 硬件转码
# • Live TV 支持
# • 完全开源免费
# • 无需订阅
#
# 💾 数据目录
# ─────────────────────────────────────────────────────────────────────────────
# /var/lib/nas-os/data/jellyfin/config - 配置文件
# /var/lib/nas-os/data/jellyfin/cache  - 缓存数据
# /var/lib/nas-os/media                - 媒体文件
#
# 🚀 部署向导
# ─────────────────────────────────────────────────────────────────────────────
# 1. 快速启动:
#    $ docker compose -f apps/templates/jellyfin.yml up -d
#
# 2. 访问 Web UI:
#    http://localhost:8096
#
# 🔧 环境变量
# ─────────────────────────────────────────────────────────────────────────────
# NAS_MEDIA_DIR - 媒体目录（默认 /var/lib/nas-os/media）
# TZ            - 时区设置
#
# v2.387.0 工部优化：应用模板标准化

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: nas-jellyfin
    restart: unless-stopped
    
    # ─── 网络配置 ─────────────────────────────────────────────────────────────
    ports:
      - "8096:8096"
    
    # ─── 存储挂载 ─────────────────────────────────────────────────────────────
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${NAS_MEDIA_DIR:-/var/lib/nas-os/media}:/media:ro
    
    # ─── 环境变量 ─────────────────────────────────────────────────────────────
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PUID=1000
      - PGID=1000
    
    # ─── 健康检查 ─────────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # ─── 资源限制 ─────────────────────────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # ─── 日志配置 ─────────────────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,app"
        tag: "{{.Name}}/{{.ImageName}}"
    
    # ─── 服务标签 ─────────────────────────────────────────────────────────────
    labels:
      - "nas-os.app=jellyfin"
      - "nas-os.category=media"
      - "nas-os.description=Open-source media server, completely free"
      - "nas-os.healthcheck.enabled=true"
      - "nas-os.logging.enabled=true"
    
    # ─── 网络隔离 ─────────────────────────────────────────────────────────────
    networks:
      - nas-app-network

# ══════════════════════════════════════════════════════════════════════════════
# 网络配置
# ══════════════════════════════════════════════════════════════════════════════
networks:
  nas-app-network:
    external: true
    name: nas-app-network

# ══════════════════════════════════════════════════════════════════════════════
# 卷配置
# ══════════════════════════════════════════════════════════════════════════════
volumes:
  jellyfin-config:
    driver: local
    labels:
      - "nas-os.app=jellyfin"
      - "nas-os.volume=config"
  
  jellyfin-cache:
    driver: local
    labels:
      - "nas-os.app=jellyfin"
      - "nas-os.volume=cache"