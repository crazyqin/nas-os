host: localhost:8080
info:
  contact:
    email: support@nas-os.io
    name: NAS-OS 团队
    url: https://github.com/crazyqin/nas-os
  description: |-
    NAS-OS 是一个现代化的网络存储操作系统，提供卷管理、用户管理、共享管理、网络配置等功能。

    ## 功能模块
    - **卷管理**: Btrfs 卷创建、快照、RAID 配置
    - **用户管理**: 用户/组管理、认证授权
    - **共享管理**: SMB/NFS 共享配置
    - **网络管理**: 网络接口、DDNS、防火墙、端口转发
    - **Docker 管理**: 容器、镜像、应用商店
    - **插件系统**: 可扩展的插件架构
    - **配额管理**: 存储配额控制
    - **性能监控**: 系统性能监控与报告

    ## 架构分层 (Core / Extension / Lab)
    生产核心生命周期仅注册 identity / storage / network / sharing / system；
    可选产品能力见 internal/extensions/*；实验与伪核心实现见 internal/lab/*。
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: NAS-OS API
  version: 3.24.6
