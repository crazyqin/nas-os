basePath: /api/v1
definitions:
  ai.ChatChoice:
    properties:
      delta:
        $ref: '#/definitions/ai.ChatMessage'
      finish_reason:
        type: string
      index:
        type: integer
      message:
        $ref: '#/definitions/ai.ChatMessage'
    type: object
  ai.ChatMessage:
    properties:
      content:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  ai.ChatRequest:
    properties:
      max_tokens:
        type: integer
      messages:
        items:
          $ref: '#/definitions/ai.ChatMessage'
        type: array
      model:
        type: string
      stop:
        items:
          type: string
        type: array
      stream:
        type: boolean
      temperature:
        type: number
      top_p:
        type: number
    type: object
  ai.ChatResponse:
    properties:
      choices:
        items:
          $ref: '#/definitions/ai.ChatChoice'
        type: array
      created:
        type: integer
      id:
        type: string
      latency_ms:
        type: integer
      model:
        type: string
      object:
        type: string
      usage:
        $ref: '#/definitions/ai.UsageInfo'
    type: object
  ai.EmbedData:
    properties:
      embedding:
        items:
          type: number
        type: array
      index:
        type: integer
      object:
        type: string
    type: object
  ai.EmbedRequest:
    properties:
      input:
        type: string
      model:
        type: string
    type: object
  ai.EmbedResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/ai.EmbedData'
        type: array
      model:
        type: string
      object:
        type: string
      usage:
        $ref: '#/definitions/ai.UsageInfo'
    type: object
  ai.ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
    type: object
  ai.UsageInfo:
    properties:
      completion_tokens:
        type: integer
      prompt_tokens:
        type: integer
      total_tokens:
        type: integer
    type: object
  aiguardrails.AIGuardrailConfig:
    properties:
      blacklist_models:
        description: 黑名单模型
        items:
          type: string
        type: array
      block_prompt_injection:
        description: 是否阻止 Prompt Injection
        type: boolean
      enabled:
        description: 全局是否启用
        type: boolean
      log_all_requests:
        description: 是否记录所有请求
        type: boolean
      max_input_length:
        description: 最大输入长度
        type: integer
      max_output_length:
        description: 最大输出长度
        type: integer
      redact_pii:
        description: 是否自动脱敏 PII
        type: boolean
      retention_days:
        description: 审计日志保留天数
        type: integer
      whitelist_models:
        description: 白名单模型
        items:
          type: string
        type: array
    type: object
  aiguardrails.Action:
    enum:
    - allow
    - block
    - warn
    - redact
    - quarantine
    type: string
    x-enum-varnames:
    - ActionAllow
    - ActionBlock
    - ActionWarn
    - ActionRedact
    - ActionQuarantine
  aiguardrails.AuditLogEntry:
    properties:
      action:
        allOf:
        - $ref: '#/definitions/aiguardrails.Action'
        description: 执行动作
      client_ip:
        description: 客户端 IP
        type: string
      direction:
        description: input/output
        type: string
      id:
        description: 日志唯一标识
        type: string
      input_text:
        description: 输入文本（截断）
        type: string
      model:
        description: 目标模型
        type: string
      output_text:
        description: 输出文本（截断）
        type: string
      reason:
        description: 原因
        type: string
      results:
        description: 检测结果
        items:
          $ref: '#/definitions/aiguardrails.DetectionResult'
        type: array
      timestamp:
        description: 记录时间
        type: string
      user:
        description: 操作用户
        type: string
    type: object
  aiguardrails.ConfigRequest:
    properties:
      blacklist_models:
        description: 黑名单
        items:
          type: string
        type: array
      block_prompt_injection:
        description: 是否阻止注入
        type: boolean
      enabled:
        description: 是否启用
        type: boolean
      log_all_requests:
        description: 是否记录所有请求
        type: boolean
      max_input_length:
        description: 最大输入长度
        type: integer
      max_output_length:
        description: 最大输出长度
        type: integer
      redact_pii:
        description: 是否脱敏 PII
        type: boolean
      retention_days:
        description: 保留天数
        type: integer
      whitelist_models:
        description: 白名单
        items:
          type: string
        type: array
    type: object
  aiguardrails.DetectionResult:
    properties:
      action:
        allOf:
        - $ref: '#/definitions/aiguardrails.Action'
        description: 执行动作
      hit:
        description: 是否命中规则
        type: boolean
      matched_text:
        description: 命中内容片段
        type: string
      message:
        description: 说明消息
        type: string
      policy_type:
        allOf:
        - $ref: '#/definitions/aiguardrails.PolicyType'
        description: 策略类型
      redacted_text:
        description: 脱敏后内容
        type: string
      rule_id:
        description: 命中规则 ID
        type: string
      rule_name:
        description: 命中规则名称
        type: string
      severity:
        allOf:
        - $ref: '#/definitions/aiguardrails.Severity'
        description: 严重程度
    type: object
  aiguardrails.FilterRequest:
    properties:
      client_ip:
        description: 客户端 IP
        type: string
      direction:
        description: 方向：input/output
        type: string
      model:
        description: 目标模型
        type: string
      text:
        description: 待检测文本
        type: string
      user:
        description: 用户标识
        type: string
    required:
    - text
    type: object
  aiguardrails.FilterResponse:
    properties:
      action:
        allOf:
        - $ref: '#/definitions/aiguardrails.Action'
        description: 最终动作
      allowed:
        description: 是否放行
        type: boolean
      clean_text:
        description: 处理后文本
        type: string
      reason:
        description: 原因
        type: string
      results:
        description: 检测结果列表
        items:
          $ref: '#/definitions/aiguardrails.DetectionResult'
        type: array
    type: object
  aiguardrails.GuardrailPolicy:
    properties:
      created_at:
        description: 创建时间
        type: string
      created_by:
        description: 创建者
        type: string
      description:
        description: 策略描述
        type: string
      id:
        description: 策略唯一标识
        type: string
      name:
        description: 策略名称
        type: string
      priority:
        description: 优先级（数字越小越高）
        type: integer
      rules:
        description: 规则列表
        items:
          $ref: '#/definitions/aiguardrails.GuardrailRule'
        type: array
      status:
        allOf:
        - $ref: '#/definitions/aiguardrails.PolicyStatus'
        description: 策略状态
      type:
        allOf:
        - $ref: '#/definitions/aiguardrails.PolicyType'
        description: 策略类型
      updated_at:
        description: 更新时间
        type: string
    type: object
  aiguardrails.GuardrailRule:
    properties:
      action:
        allOf:
        - $ref: '#/definitions/aiguardrails.Action'
        description: 命中时执行的动作
      description:
        description: 规则描述
        type: string
      enabled:
        description: 是否启用
        type: boolean
      id:
        description: 规则唯一标识
        type: string
      name:
        description: 规则名称
        type: string
      pattern:
        description: 匹配模式（正则表达式或关键词）
        type: string
      severity:
        allOf:
        - $ref: '#/definitions/aiguardrails.Severity'
        description: 严重程度
      type:
        allOf:
        - $ref: '#/definitions/aiguardrails.RuleType'
        description: 规则类型
    type: object
  aiguardrails.ListResponse:
    properties:
      items:
        description: 列表项
      total:
        description: 总数
        type: integer
    type: object
  aiguardrails.PolicyRequest:
    properties:
      created_by:
        description: 创建者
        type: string
      description:
        description: 描述
        type: string
      name:
        description: 策略名称
        type: string
      priority:
        description: 优先级
        type: integer
      rules:
        description: 规则列表
        items:
          $ref: '#/definitions/aiguardrails.GuardrailRule'
        type: array
      type:
        allOf:
        - $ref: '#/definitions/aiguardrails.PolicyType'
        description: 策略类型
    required:
    - created_by
    - name
    - type
    type: object
  aiguardrails.PolicyStatus:
    enum:
    - enabled
    - disabled
    type: string
    x-enum-varnames:
    - StatusEnabled
    - StatusDisabled
  aiguardrails.PolicyType:
    enum:
    - input_filter
    - output_filter
    - sensitive_data
    - pii_detection
    - prompt_injection
    - content_safety
    type: string
    x-enum-varnames:
    - PolicyInputFilter
    - PolicyOutputFilter
    - PolicySensitiveData
    - PolicyPII
    - PolicyPromptInjection
    - PolicyContentSafety
  aiguardrails.RuleType:
    enum:
    - regex
    - keyword
    - semantic
    - length
    - pattern
    type: string
    x-enum-varnames:
    - RuleRegex
    - RuleKeyword
    - RuleSemantic
    - RuleLength
    - RulePattern
  aiguardrails.Severity:
    enum:
    - low
    - medium
    - high
    - critical
    type: string
    x-enum-varnames:
    - SeverityLow
    - SeverityMedium
    - SeverityHigh
    - SeverityCritical
  api.Response:
    properties:
      code:
        description: 业务码：0=成功，非0=失败
        example: 0
        type: integer
      data:
        description: 响应数据
      message:
        description: 响应消息
        example: success
        type: string
    type: object
  backup.BackupStats:
    properties:
      averageDuration:
        $ref: '#/definitions/time.Duration'
      avgDuration:
        $ref: '#/definitions/time.Duration'
      failedCount:
        type: integer
      incrementalRatio:
        type: number
      lastBackupTime:
        type: string
      nextBackupTime:
        type: string
      successCount:
        type: integer
      successRate:
        type: number
      totalBackups:
        type: integer
      totalSize:
        type: integer
      totalSizeHuman:
        type: string
    type: object
  backup.CheckItem:
    properties:
      message:
        type: string
      name:
        type: string
      status:
        description: pass, warn, fail, skip
        type: string
    type: object
  backup.CheckStatus:
    enum:
    - pending
    - running
    - completed
    - failed
    - cancelled
    type: string
    x-enum-varnames:
    - CheckStatusPending
    - CheckStatusRunning
    - CheckStatusCompleted
    - CheckStatusFailed
    - CheckStatusCancelled
  backup.CheckSummary:
    properties:
      corruptedBytes:
        description: CorruptedBytes 损坏字节数
        type: integer
      corruptedFiles:
        description: CorruptedFiles 损坏文件数
        type: integer
      corruptionRate:
        description: CorruptionRate 损坏率（百分比）
        type: number
      dataIntegrityScore:
        description: DataIntegrityScore 数据完整性评分（0-100）
        type: number
      extraFiles:
        description: ExtraFiles 多余文件数
        type: integer
      healthyBytes:
        description: HealthyBytes 健康字节数
        type: integer
      healthyFiles:
        description: HealthyFiles 健康文件数
        type: integer
      missingFiles:
        description: MissingFiles 缺失文件数
        type: integer
      totalBytes:
        description: TotalBytes 总字节数
        type: integer
      totalFiles:
        description: TotalFiles 总文件数
        type: integer
    type: object
  backup.CheckType:
    enum:
    - full
    - sample
    - quick
    - metadata
    type: string
    x-enum-varnames:
    - CheckTypeFull
    - CheckTypeSample
    - CheckTypeQuick
    - CheckTypeMetadata
  backup.CloudConfig:
    properties:
      bucket:
        description: S3 bucket 或 WebDAV 根路径
        type: string
      encryption:
        description: 上传前加密
        type: boolean
      endpoint:
        description: S3 endpoint 或 WebDAV URL
        type: string
      insecure:
        description: 跳过 TLS 验证（WebDAV）
        type: boolean
      prefix:
        description: 路径前缀
        type: string
      provider:
        $ref: '#/definitions/backup.CloudProvider'
      region:
        description: S3 region
        type: string
    type: object
  backup.CloudProvider:
    enum:
    - s3
    - webdav
    - aliyun
    type: string
    x-enum-varnames:
    - CloudProviderS3
    - CloudProviderWebDAV
    - CloudProviderAliyun
  backup.ConfigCheckResult:
    properties:
      checks:
        items:
          $ref: '#/definitions/backup.CheckItem'
        type: array
      configId:
        type: string
      status:
        description: pass, warn, fail
        type: string
    type: object
  backup.ConflictResolution:
    enum:
    - latest
    - source
    - dest
    - keep-both
    - manual
    type: string
    x-enum-comments:
      ConflictDest: 目标优先
      ConflictKeepBoth: 保留两者
      ConflictLatest: 最新者胜
      ConflictManual: 手动解决
      ConflictSource: 源优先
    x-enum-descriptions:
    - 最新者胜
    - 源优先
    - 目标优先
    - 保留两者
    - 手动解决
    x-enum-varnames:
    - ConflictLatest
    - ConflictSource
    - ConflictDest
    - ConflictKeepBoth
    - ConflictManual
  backup.CorruptedItem:
    properties:
      actualChecksum:
        description: ActualChecksum 实际校验和
        type: string
      blockOffset:
        description: BlockOffset 损坏块偏移（如果是块损坏）
        type: integer
      blockSize:
        description: BlockSize 损坏块大小
        type: integer
      corruptionType:
        allOf:
        - $ref: '#/definitions/backup.CorruptionType'
        description: Type 损坏类型
      description:
        description: Description 描述
        type: string
      detectedAt:
        description: DetectedAt 检测时间
        type: string
      expectedChecksum:
        description: ExpectedChecksum 期望校验和
        type: string
      path:
        description: Path 文件路径
        type: string
      severity:
        allOf:
        - $ref: '#/definitions/backup.Severity'
        description: Severity 严重程度
      size:
        description: Size 文件大小
        type: integer
    type: object
  backup.CorruptionType:
    enum:
    - checksum_mismatch
    - block_corruption
    - file_missing
    - file_extra
    - metadata_corruption
    - file_truncated
    - file_modified
    type: string
    x-enum-varnames:
    - CorruptionChecksum
    - CorruptionBlock
    - CorruptionMissing
    - CorruptionExtra
    - CorruptionMetadata
    - CorruptionTruncated
    - CorruptionModified
  backup.HealthCheckResult:
    properties:
      details:
        additionalProperties: true
        type: object
      status:
        type: string
      timestamp:
        type: string
    type: object
  backup.History:
    properties:
      checksum:
        type: string
      configId:
        type: string
      createdAt:
        type: string
      duration:
        type: integer
      fileCount:
        type: integer
      id:
        type: string
      name:
        type: string
      path:
        type: string
      size:
        type: integer
      type:
        $ref: '#/definitions/backup.Type'
      verified:
        type: boolean
    type: object
  backup.IntegrityCheckJob:
    properties:
      backupTaskId:
        description: BackupTaskID 备份任务ID
        type: string
      checkType:
        allOf:
        - $ref: '#/definitions/backup.CheckType'
        description: CheckType 校验类型
      checkedBytes:
        description: CheckedBytes 已校验字节数
        type: integer
      checkedFiles:
        description: CheckedFiles 已校验文件数
        type: integer
      corruptedBlocks:
        description: CorruptedBlocks 损坏数据块数
        type: integer
      corruptedFiles:
        description: CorruptedFiles 损坏文件数
        type: integer
      corruptedRate:
        description: CorruptedRate 损坏率（百分比）
        type: number
      endTime:
        description: EndTime 结束时间
        type: string
      errorMessage:
        description: ErrorMessage 错误信息
        type: string
      extraFiles:
        description: ExtraFiles 多余文件数
        type: integer
      id:
        description: ID 任务ID
        type: string
      missingFiles:
        description: MissingFiles 缺失文件数
        type: integer
      progress:
        description: Progress 进度百分比
        type: integer
      reportId:
        description: ReportID 校验报告ID
        type: string
      speed:
        description: Speed 校验速度 (MB/s)
        type: number
      startTime:
        description: StartTime 开始时间
        type: string
      status:
        allOf:
        - $ref: '#/definitions/backup.CheckStatus'
        description: Status 任务状态
      totalBytes:
        description: TotalBytes 总字节数
        type: integer
      totalFiles:
        description: TotalFiles 总文件数
        type: integer
    type: object
  backup.IntegrityCheckReport:
    properties:
      backupTaskId:
        description: BackupTaskID 备份任务ID
        type: string
      checkDuration:
        allOf:
        - $ref: '#/definitions/time.Duration'
        description: CheckDuration 校验耗时
      corruptedItems:
        description: CorruptedItems 损坏项列表
        items:
          $ref: '#/definitions/backup.CorruptedItem'
        type: array
      generatedAt:
        description: GeneratedAt 生成时间
        type: string
      healthy:
        description: Healthy 是否健康
        type: boolean
      id:
        description: ID 报告ID
        type: string
      jobId:
        description: JobID 校验任务ID
        type: string
      recommendations:
        description: Recommendations 建议
        items:
          $ref: '#/definitions/backup.Recommendation'
        type: array
      summary:
        allOf:
        - $ref: '#/definitions/backup.CheckSummary'
        description: Summary 校验摘要
    type: object
  backup.IntegrityCheckRequest:
    properties:
      backupTaskId:
        description: BackupTaskID 备份任务ID
        type: string
      checkType:
        allOf:
        - $ref: '#/definitions/backup.CheckType'
        description: CheckType 校验类型
      deepScan:
        description: DeepScan 是否深度扫描（校验所有数据块）
        type: boolean
      sampleRatio:
        description: SampleRatio 抽样比例（0-1，仅用于抽样校验）
        type: number
      verifyChecksum:
        description: VerifyChecksum 是否验证已存储的校验和
        type: boolean
    required:
    - backupTaskId
    type: object
  backup.IntegrityRecommendationType:
    enum:
    - restore
    - rebackup
    - ignore
    - verify
    - repair
    type: string
    x-enum-varnames:
    - IntegrityRecommendationRestore
    - IntegrityRecommendationRebackup
    - IntegrityRecommendationIgnore
    - IntegrityRecommendationVerify
    - IntegrityRecommendationRepair
  backup.JobConfig:
    properties:
      chunkPath:
        description: 增量备份配置
        type: string
      cloudBackup:
        description: 云端备份配置
        type: boolean
      cloudConfig:
        $ref: '#/definitions/backup.CloudConfig'
      compression:
        type: boolean
      destination:
        type: string
      enabled:
        type: boolean
      encrypt:
        type: boolean
      encryption:
        description: 加密配置
        type: boolean
      encryptionKeyFile:
        type: string
      encryptionType:
        type: string
      exclude:
        items:
          type: string
        type: array
      id:
        type: string
      lastRun:
        type: string
      name:
        type: string
      nextRun:
        type: string
      remoteHost:
        description: 远程配置
        type: string
      remotePort:
        type: integer
      remoteUser:
        type: string
      retention:
        type: integer
      rsyncOptions:
        description: rsync 特定配置
        items:
          type: string
        type: array
      schedule:
        type: string
      source:
        type: string
      timeout:
        allOf:
        - $ref: '#/definitions/time.Duration'
        description: 超时配置
      type:
        $ref: '#/definitions/backup.Type'
    type: object
  backup.Recommendation:
    properties:
      action:
        description: Action 建议操作
        type: string
      affectedItems:
        description: AffectedItems 受影响项数量
        type: integer
      description:
        description: Description 描述
        type: string
      priority:
        description: Priority 优先级
        type: integer
      type:
        allOf:
        - $ref: '#/definitions/backup.IntegrityRecommendationType'
        description: Type 建议类型
    type: object
  backup.RemoteConfig:
    properties:
      accessKey:
        type: string
      bucket:
        description: S3 配置
        type: string
      endpoint:
        type: string
      insecure:
        description: 通用
        type: boolean
      prefix:
        description: 路径前缀
        type: string
      region:
        type: string
      url:
        description: WebDAV 配置
        type: string
      username:
        type: string
    type: object
  backup.RemoteType:
    enum:
    - local
    - s3
    - webdav
    type: string
    x-enum-varnames:
    - RemoteTypeLocal
    - RemoteTypeS3
    - RemoteTypeWebDAV
  backup.RestoreOptions:
    properties:
      backupId:
        type: string
      decrypt:
        type: boolean
      overwrite:
        type: boolean
      password:
        type: string
      targetPath:
        type: string
    type: object
  backup.RestorePreset:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
      options:
        $ref: '#/definitions/backup.RestoreOptions'
    type: object
  backup.RestorePreview:
    properties:
      backupPath:
        type: string
      estimatedTime:
        type: string
      fileCount:
        type: integer
      files:
        items:
          type: string
        type: array
      overwrite:
        type: boolean
      targetPath:
        type: string
      totalSize:
        type: integer
      totalSizeHuman:
        type: string
    type: object
  backup.Severity:
    enum:
    - low
    - medium
    - high
    - critical
    type: string
    x-enum-varnames:
    - SeverityLow
    - SeverityMedium
    - SeverityHigh
    - SeverityCritical
  backup.SyncMode:
    enum:
