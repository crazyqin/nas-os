<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件管理器 - NAS-OS</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../brand/logo/logo-32.png">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../js/filemanager.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-brand">
                <img src="../brand/logo/logo-64.png" alt="Logo" width="40" height="40">
                <h1>NAS-OS</h1>
            </div>
            <nav class="header-nav">
                <a href="../index.html">仪表盘</a>
                <a href="files.html">文件共享</a>
                <a href="#" class="active">文件管理器</a>
                <a href="users.html">用户管理</a>
                <a href="settings.html">设置</a>
            </nav>
            <div class="header-actions">
                <button id="theme-toggle" class="btn-icon" title="切换主题">🌓</button>
                <button id="notification-btn" class="btn-icon" title="通知">
                    🔔
                    <span id="notification-badge" class="badge" style="display: none;">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- File Manager will be mounted here -->
            <div id="file-manager"></div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script src="../js/fileupload.js"></script>
    <script src="../js/filepreview.js"></script>
    <script src="../js/fileshare.js"></script>
    <script src="../js/filemanager.js"></script>
    
    <script>
        // Initialize File Manager
        let fileManager;
        let fileUpload;
        let filePreview;
        let fileShare;

        document.addEventListener('DOMContentLoaded', () => {
            // Create global instances for onclick handlers
            fileManager = new FileManager({
                apiBase: '/api/v1/files',
                containerId: 'file-manager',
                currentPath: '/'
            });

            // Expose sub-managers for onclick handlers
            fileUpload = fileManager.uploadManager;
            filePreview = fileManager.previewManager;
            fileShare = fileManager.shareManager;
        });
    </script>
</body>
</html>
