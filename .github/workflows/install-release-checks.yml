name: Installer and release asset checks
on:
  pull_request:
    paths:
      - README.md
      - scripts/install.sh
      - scripts/verify-release-assets.sh
      - scripts/test_install_release.py
      - scripts/test_release_pipeline.py
      - scripts/verify-release-binaries.py
      - scripts/test_release_binaries.py
      - VERSION
      - internal/storage/efficiency.go
      - internal/storage/filesystem_space*.go
      - .github/workflows/docker-publish.yml
      - .github/workflows/staged-release.yml
      - .github/workflows/release.yml
      - .github/workflows/install-release-checks.yml
  push:
    branches: [master, fix/issue-50-install-release]
    paths:
      - README.md
      - scripts/install.sh
      - scripts/verify-release-assets.sh
      - scripts/test_install_release.py
      - scripts/test_release_pipeline.py
      - scripts/verify-release-binaries.py
      - scripts/test_release_binaries.py
      - VERSION
      - internal/storage/efficiency.go
      - internal/storage/filesystem_space*.go
      - .github/workflows/docker-publish.yml
      - .github/workflows/staged-release.yml
      - .github/workflows/release.yml
      - .github/workflows/install-release-checks.yml
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: bash -n scripts/install.sh scripts/verify-release-assets.sh
      - run: python3 scripts/test_install_release.py
      - run: python3 scripts/test_release_pipeline.py
      - run: python3 scripts/test_release_binaries.py
  native-space-statistics:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Verify native filesystem capacity API
        shell: bash
        run: |
          set -euo pipefail
          suffix=unix
          if [ "$RUNNER_OS" = Windows ]; then suffix=windows; fi
          go test "./internal/storage/filesystem_space_$suffix.go" ./internal/storage/filesystem_space_test.go -v
  cross-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: linux, arch: arm, arm: '7'}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
          - {os: windows, arch: amd64}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Build and verify actual executable targets
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm || '' }}
        run: |
          set -euo pipefail
          for binary in nasd nasctl; do
            go build -trimpath -o "$RUNNER_TEMP/$binary" "./cmd/$binary"
            python3 scripts/verify-release-binaries.py --os "$GOOS" --arch "$GOARCH" "$RUNNER_TEMP/$binary"
          done
