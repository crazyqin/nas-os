# NAS-OS 性能基准测试工作流
# 定期运行 Go benchmark 测试，追踪性能变化
#
# Go 版本: 1.26（与 go.mod 保持一致）
#
# 当前版本: v2.253.283（工部维护）

name: Benchmark

on:
  # 手动触发
  workflow_dispatch:
  
  # 每周一凌晨 2 点运行（UTC）
  schedule:
    - cron: '0 2 * * 1'
  
  # PR 到 master 时运行（可选，用于性能回归检测）
  pull_request:
    branches: [master]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/benchmark.yml'

env:
  GO_VERSION: '1.26.1'
  CACHE_VERSION: 'v13'
  GOPROXY: 'https://proxy.golang.org,direct'

jobs:
  benchmark:
    name: 运行基准测试
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      
      - name: 恢复 Go 编译缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ env.CACHE_VERSION }}-benchmark-build-${{ hashFiles('go.sum') }}
  # 性能回归检测（可选）
  regression-check:
    name: 性能回归检测
    runs-on: ubuntu-latest
    needs: [benchmark]
    if: github.event_name == 'pull_request'
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载基准测试结果
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/

      - name: 设置 Go
        uses: actions/setup-go@v6
      
      - name: 检查性能回归
        id: check
        run: |
          echo "🔍 检查性能回归..."
          
          # 这里可以添加更复杂的性能回归检测逻辑
          # 例如：比较 ns/op 是否增加超过 10%
          
          # 简单示例：检查是否有测试失败
          if grep -q "FAIL" benchmark-results/benchmark.txt; then
            echo "❌ 检测到基准测试失败"
            echo "has_regression=true" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ 未检测到性能回归"
          echo "has_regression=false" >> $GITHUB_OUTPUT
      
      - name: 性能回归警告
        if: steps.check.outputs.has_regression == 'true'
        run: |
          echo "::warning::检测到可能的性能回归，请检查基准测试结果"