# 兼容性检查工作流
# 参考: 群晖 DSM 7.3 兼容性检测机制
#
# 功能:
# - Go 版本兼容性检查
# - Docker Compose 配置验证
# - API 破坏性变更检测
# - 数据库迁移兼容性检查
#
# 当前版本: v1.0.0（工部维护）

name: Compatibility Check

on:
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  pull-requests: write

jobs:
  # ========== Go 版本兼容性 ==========
  go-version-check:
    name: Go 版本兼容性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26']
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 构建检查
        run: |
          if go build ./...; then
            echo "✅ Go ${{ matrix.go-version }} 构建成功"
          else
            echo "❌ Go ${{ matrix.go-version }} 构建失败"
            exit 1
          fi

      - name: 测试检查
        run: |
          go test -short ./... 2>&1 || echo "⚠️ 部分测试失败"

  # ========== Docker Compose 配置验证 ==========
  compose-check:
    name: Docker Compose 验证
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 验证 docker-compose.yml
        run: |
          echo "## 🐳 Docker Compose 配置验证" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for compose_file in docker-compose*.yml; do
            if [ -f "$compose_file" ]; then
              echo "检查 $compose_file..."
              if docker compose -f "$compose_file" config --quiet 2>/dev/null; then
                echo "✅ $compose_file 配置有效" >> $GITHUB_STEP_SUMMARY
              else
                echo "❌ $compose_file 配置无效" >> $GITHUB_STEP_SUMMARY
                docker compose -f "$compose_file" config 2>&1 || true
                exit 1
              fi
            fi
          done

      - name: 检查服务健康检查配置
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 健康检查配置" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for compose_file in docker-compose*.yml; do
            if [ -f "$compose_file" ]; then
              # 检查是否有健康检查
              if grep -q "healthcheck:" "$compose_file"; then
                echo "✅ $compose_file 包含健康检查" >> $GITHUB_STEP_SUMMARY
              else
                echo "⚠️ $compose_file 缺少健康检查" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done

  # ========== API 兼容性检查 ==========
  api-check:
    name: API 兼容性检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 检测 API 变更
        id: api-changes
        run: |
          echo "## 📡 API 兼容性检查" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 获取变更的 API 文件
          CHANGED_API_FILES=$(git diff --name-only origin/master...HEAD -- 'api/*.go' 'internal/api/*.go' 2>/dev/null || echo "")
          
          if [ -z "$CHANGED_API_FILES" ]; then
            echo "✅ 无 API 文件变更" >> $GITHUB_STEP_SUMMARY
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "⚠️ 检测到 API 文件变更:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$CHANGED_API_FILES" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 检测破坏性变更
        if: steps.api-changes.outputs.has_changes == 'true'
        run: |
          # 检查是否有删除的函数/结构体
          DELETED=$(git diff origin/master...HEAD -- 'api/*.go' 'internal/api/*.go' 2>/dev/null | grep -E "^-func |^-type " | grep -v "^---" || echo "")
          
          if [ -n "$DELETED" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ 潜在破坏性变更" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
            echo "$DELETED" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ 请确认这些变更不会破坏现有客户端" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ 未检测到明显的破坏性变更" >> $GITHUB_STEP_SUMMARY
          fi

  # ========== 数据库迁移检查 ==========
  migration-check:
    name: 数据库迁移检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 检测迁移文件变更
        id: migration-changes
        run: |
          echo "## 🗄️ 数据库迁移检查" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 检查是否有迁移文件
          MIGRATION_DIR=""
          for dir in migrations migrations/sql db/migrations; do
            if [ -d "$dir" ]; then
              MIGRATION_DIR="$dir"
              break
            fi
          done
          
          if [ -z "$MIGRATION_DIR" ]; then
            echo "✅ 未发现迁移目录，跳过检查" >> $GITHUB_STEP_SUMMARY
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # 获取变更的迁移文件
          CHANGED_MIGRATIONS=$(git diff --name-only origin/master...HEAD -- "${MIGRATION_DIR}/*" 2>/dev/null || echo "")
          
          if [ -z "$CHANGED_MIGRATIONS" ]; then
            echo "✅ 无迁移文件变更" >> $GITHUB_STEP_SUMMARY
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "has_migrations=true" >> $GITHUB_OUTPUT
          echo "⚠️ 检测到迁移文件变更:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$CHANGED_MIGRATIONS" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 检查迁移文件命名
        if: steps.migration-changes.outputs.has_migrations == 'true'
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 迁移文件检查" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 检查文件命名格式
          for file in $(git diff --name-only origin/master...HEAD -- "migrations/*" "db/migrations/*" 2>/dev/null); do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              # 检查是否有 down 迁移
              if [[ "$filename" == *".up."* ]]; then
                down_file="${filename/.up./.down.}"
                dir=$(dirname "$file")
                if [ ! -f "$dir/$down_file" ]; then
                  echo "⚠️ $filename 缺少对应的 down 迁移" >> $GITHUB_STEP_SUMMARY
                else
                  echo "✅ $filename 有对应的 down 迁移" >> $GITHUB_STEP_SUMMARY
                fi
              fi
            fi
          done

  # ========== 依赖兼容性检查 ==========
  dependency-check:
    name: 依赖兼容性检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 检查 go.mod 变更
        id: dep-changes
        run: |
          echo "## 📦 依赖兼容性检查" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if git diff --name-only origin/master...HEAD | grep -q "go.mod\|go.sum"; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "⚠️ 检测到依赖变更" >> $GITHUB_STEP_SUMMARY
            
            # 显示变更
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### go.mod 变更" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
            git diff origin/master...HEAD go.mod 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "无变更" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ 无依赖变更" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 检查依赖安全性
        run: |
          go list -m -json all 2>/dev/null | grep -E '"Path"|"Version"' | head -40 || echo "依赖列表获取完成"

  # ========== 兼容性汇总 ==========
  compatibility-summary:
    name: 兼容性汇总
    runs-on: ubuntu-latest
    needs: [go-version-check, compose-check, api-check, migration-check, dependency-check]
    if: always()
    steps:
      - name: 生成汇总报告
        run: |
          echo "## 📋 兼容性检查汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Go 版本兼容性 | ${{ needs.go-version-check.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Compose | ${{ needs.compose-check.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API 兼容性 | ${{ needs.api-check.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 数据库迁移 | ${{ needs.migration-check.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 依赖兼容性 | ${{ needs.dependency-check.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY