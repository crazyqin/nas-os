# 兼容性检查 Workflow
# 验证代码在不同 Go 版本和平台上的兼容性
#
# 功能:
# - Go 版本兼容性检查 (1.26)
# - 多平台构建验证 (linux/amd64, linux/arm64)
# - Docker Compose 配置验证
# - API 破坏性变更检测
# - 数据库迁移兼容性检查
# - 依赖版本兼容性
#
# 当前版本: v1.1.0（工部维护）

name: Compatibility Check

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  schedule:
    # 每周一 04:00 UTC 运行
    - cron: '0 4 * * 1'
  workflow_dispatch:

env:
  GO_VERSION: '1.26.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOPROXY: 'https://proxy.golang.org,direct'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ========== Go 版本兼容性 ==========
  go-version-matrix:
    name: Go ${{ matrix.go-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26']
        os: [ubuntu-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: 恢复 Go 模块与编译缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: compatibility-${{ runner.os }}-${{ runner.arch }}-go${{ matrix.go-version }}-${{ hashFiles('go.sum') }}

      - name: 验证 go.mod 版本
        run: |
          MOD_VERSION=$(grep -E '^go [0-9]' go.mod | awk '{print $2}')
          echo "go.mod 指定版本: $MOD_VERSION"
          echo "当前测试版本: ${{ matrix.go-version }}"
          
          if [[ "${{ matrix.go-version }}" == "1.26" ]]; then
            echo "✅ Go 1.26 兼容当前模块版本"
          fi

      - name: 下载依赖
        run: go mod download

      - name: 验证依赖
        run: go mod verify

      - name: 构建验证
        run: |
          echo "=== 构建 cmd/nasd ==="
          go build -v ./cmd/nasd
          
          echo "=== 构建所有包 ==="
          go build -v ./...

      - name: 运行测试
        run: |
          # 跳过 e2e 和插件测试
          go test -v -short -timeout 10m $(go list ./... | grep -v /e2e | grep -v /plugins/)

      - name: go vet 检查
        run: go vet ./...

      - name: 生成兼容性报告
        if: always()
        run: |
          echo "## 📊 Go ${{ matrix.go-version }} 兼容性报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 构建 | ${{ job.status == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 测试 | ${{ job.status == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| vet | ${{ job.status == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY

  # ========== Docker Compose 配置验证 ==========
  compose-check:
    name: Docker Compose 验证
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 验证 docker-compose.yml
        run: |
          echo "## 🐳 Docker Compose 配置验证" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          shopt -s nullglob
          compose_files=(docker-compose*.yml)
          
          if [ ${#compose_files[@]} -eq 0 ]; then
            echo "⚠️ 未找到 docker-compose*.yml 文件" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          FAILED=0
          for compose_file in "${compose_files[@]}"; do
            echo "检查 $compose_file..."
            if docker compose -f "$compose_file" config --quiet 2>/dev/null; then
              echo "✅ $compose_file 配置有效" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ $compose_file 配置无效" >> $GITHUB_STEP_SUMMARY
              docker compose -f "$compose_file" config 2>&1 || true
              FAILED=1
            fi
          done
          
          if [ $FAILED -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ 部分 compose 文件验证失败" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 检查服务健康检查配置
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 健康检查配置" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          shopt -s nullglob
          compose_files=(docker-compose*.yml)
          
          for compose_file in "${compose_files[@]}"; do
            if grep -q "healthcheck:" "$compose_file"; then
              echo "✅ $compose_file 包含健康检查" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ $compose_file 缺少健康检查" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: 验证 Dockerfile 语法
        run: |
          echo "=== 验证 Dockerfile 语法 ==="
          
          shopt -s nullglob
          dockerfiles=(Dockerfile*)
          
          if [ ${#dockerfiles[@]} -eq 0 ]; then
            echo "⚠️ 未找到 Dockerfile"
            exit 0
          fi
          
          for dockerfile in "${dockerfiles[@]}"; do
            echo "检查: $dockerfile"
            if [ -f "$dockerfile" ]; then
              echo "✅ $dockerfile 文件存在"
            fi
          done

  # ========== API 兼容性检查 ==========
  api-check:
    name: API 兼容性检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 检测 API 变更
        id: api-changes
        run: |
          echo "## 📡 API 兼容性检查" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          CHANGED_API_FILES=$(git diff --name-only origin/master...HEAD -- 'api/*.go' 'internal/api/*.go' 2>/dev/null || echo "")
          
          if [ -z "$CHANGED_API_FILES" ]; then
            echo "✅ 无 API 文件变更" >> $GITHUB_STEP_SUMMARY
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "⚠️ 检测到 API 文件变更:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$CHANGED_API_FILES" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 检测破坏性变更
        if: steps.api-changes.outputs.has_changes == 'true'
        run: |
          DELETED=$(git diff origin/master...HEAD -- 'api/*.go' 'internal/api/*.go' 2>/dev/null | grep -E "^-func |^-type " | grep -v "^---" || echo "")
          
          if [ -n "$DELETED" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ 潜在破坏性变更" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
            echo "$DELETED" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ 请确认这些变更不会破坏现有客户端" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ 未检测到明显的破坏性变更" >> $GITHUB_STEP_SUMMARY
          fi

  # ========== 数据库迁移检查 ==========
  migration-check:
    name: 数据库迁移检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 检测迁移文件变更
        id: migration-changes
        run: |
          echo "## 🗄️ 数据库迁移检查" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          MIGRATION_DIR=""
          for dir in migrations migrations/sql db/migrations; do
            if [ -d "$dir" ]; then
              MIGRATION_DIR="$dir"
              break
            fi
          done
          
          if [ -z "$MIGRATION_DIR" ]; then
            echo "✅ 未发现迁移目录，跳过检查" >> $GITHUB_STEP_SUMMARY
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          CHANGED_MIGRATIONS=$(git diff --name-only origin/master...HEAD -- "${MIGRATION_DIR}/*" 2>/dev/null || echo "")
          
          if [ -z "$CHANGED_MIGRATIONS" ]; then
            echo "✅ 无迁移文件变更" >> $GITHUB_STEP_SUMMARY
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "has_migrations=true" >> $GITHUB_OUTPUT
          echo "⚠️ 检测到迁移文件变更:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$CHANGED_MIGRATIONS" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 检查迁移文件命名
        if: steps.migration-changes.outputs.has_migrations == 'true'
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 迁移文件检查" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for file in $(git diff --name-only origin/master...HEAD -- "migrations/*" "db/migrations/*" 2>/dev/null); do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              if [[ "$filename" == *".up."* ]]; then
                down_file="${filename/.up./.down.}"
                dir=$(dirname "$file")
                if [ ! -f "$dir/$down_file" ]; then
                  echo "⚠️ $filename 缺少对应的 down 迁移" >> $GITHUB_STEP_SUMMARY
                else
                  echo "✅ $filename 有对应的 down 迁移" >> $GITHUB_STEP_SUMMARY
                fi
              fi
            fi
          done

  # ========== 依赖兼容性检查 ==========
  dependency-check:
    name: 依赖兼容性检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 检查依赖更新
        run: |
          echo "=== 检查可更新的依赖 ==="
          go list -u -m all 2>/dev/null | grep -E "\[.*\]" || echo "所有依赖都是最新版本"
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 依赖状态" >> $GITHUB_STEP_SUMMARY

      - name: 验证依赖安全
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          if govulncheck ./... 2>&1; then
            echo "✅ 未发现已知漏洞"
          else
            echo "⚠️ 发现已知漏洞或检查失败，请检查上方输出"
          fi

      - name: 检查间接依赖
        run: |
          echo "=== 间接依赖统计 ==="
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 直接依赖: $(go list -m all | grep -v "indirect" | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- 间接依赖: $(go list -m all | grep "indirect" | wc -l)" >> $GITHUB_STEP_SUMMARY

  # ========== 兼容性汇总 ==========
  compatibility-summary:
    name: 兼容性汇总
    runs-on: ubuntu-latest
    needs: [go-version-matrix, compose-check, api-check, migration-check, dependency-check]
    if: always()
    timeout-minutes: 5
    steps:
      - name: 生成汇总报告
        run: |
          echo "## 🔍 兼容性检查汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Go 版本矩阵 | ${{ needs.go-version-matrix.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Compose | ${{ needs.compose-check.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API 兼容性 | ${{ needs.api-check.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 数据库迁移 | ${{ needs.migration-check.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 依赖兼容性 | ${{ needs.dependency-check.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**触发方式:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**提交:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
